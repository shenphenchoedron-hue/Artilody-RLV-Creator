name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  linux:
    name: Linux (.deb + tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xkb1 libpulse0 libdbus-1-3
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Version
        id: v
        run: echo "version=$(python -c 'import rlvcreator;print(rlvcreator.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: python -m pytest -v tests
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/rlvcreator.spec
      - name: Self test
        run: dist/artilody-rlv-creator/artilody-rlv-creator --selftest
      - name: Build .deb and tar.gz
        run: |
          packaging/build_deb.sh "${{ steps.v.outputs.version }}" amd64
          tar -C dist -czf "release/Artilody-RLV-Creator-${{ steps.v.outputs.version }}-Linux-x86_64.tar.gz" artilody-rlv-creator
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  test-deb:
    name: Install test (${{ matrix.image }})
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Install package
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./artilody-rlv-creator_*_amd64.deb
      - name: Self test
        run: artilody-rlv-creator --selftest

  windows:
    name: Windows (installer + zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(python -c 'import rlvcreator;print(rlvcreator.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: python -m pytest -v tests
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/rlvcreator.spec
      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\artilody-rlv-creator\Artilody RLV Creator.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self test failed: $($p.ExitCode)" }
      - name: Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=${{ steps.v.outputs.version }}" packaging\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\artilody-rlv-creator -DestinationPath "release\Artilody-RLV-Creator-${{ steps.v.outputs.version }}-Windows-Portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  macos:
    name: macOS ${{ matrix.arch }} (.dmg)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: AppleSilicon
          - os: macos-15-intel
            arch: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Version
        id: v
        run: echo "version=$(python -c 'import rlvcreator;print(rlvcreator.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: python -m pytest -v tests
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/rlvcreator.spec
      - name: Self test
        run: '"dist/Artilody RLV Creator.app/Contents/MacOS/Artilody RLV Creator" --selftest'
      - name: Build DMG
        run: |
          mkdir -p release dmg
          cp -R "dist/Artilody RLV Creator.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Artilody RLV Creator" -srcfolder dmg -ov -format UDZO \
            "release/Artilody-RLV-Creator-${{ steps.v.outputs.version }}-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, test-deb, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Artilody RLV Creator ${{ github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: artifacts/*
